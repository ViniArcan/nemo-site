{% extends './partials/base_layout.html' %}

{% block styles %}
<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/editor.css') }}">
{% endblock %}

{% block content %}
<div class="central-content" style="max-width: 1400px; margin-top: 40px; margin-left: auto; margin-right: auto;">
    
    <h2 class="section-title">Editando Post</h2>

    <form id="editor-form" method="POST" action="{{ url_for('save_post', path=post.path) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="editor-container">

            <div class="editor-header">
                
                <div class="row g-3 align-items-center">

                    <div class="col-lg-2 col-md-3">
                        <input type="file" id="asset-upload-input" style="display: none;">
                        <button type="button" class="btn btn-secondary w-100" onclick="document.getElementById('asset-upload-input').click();">
                            Importar
                        </button>
                    </div>

                    <div class="col-lg-2 col-md-3">
                        {% if post.path %}
                        <a href="{{ url_for('view_post', path=post.path) }}" target="_blank" class="btn btn-outline-primary w-100" rel="noopener noreferrer">
                            Ver Post
                        </a>
                        {% endif %}
                    </div>

                    <div class="col-lg-2 col-md-3">
                        <button type="submit" form="editor-form" class="btn btn-primary w-100">
                            Salvar
                        </button>
                    </div>

                    <div class="col-lg-2 col-md-3">
                         {% if post.path %}
                        <button type="submit" form="delete-post-form" class="btn btn-danger w-100">
                            Deletar
                        </button>
                        {% endif %}
                    </div>

                    <div class="col-lg-4 col-md-12 mt-md-3">
                        <span id="upload-status"></span>
                    </div>

                </div>
            </div> 
            <textarea id="post-content" name="content">{{ post.content or '' }}</textarea>

        </div> 
    </form> 
    
    {% if post.path %}
    <form id="delete-post-form" action="{{ url_for('delete_post_file', path=post.path) }}" method="POST" style="display: none;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    </form>
    {% endif %}

</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize EasyMDE
        const easyMDE = new EasyMDE({
            element: document.getElementById('post-content'),
            spellChecker: false,
        });

        // --- Delete Confirmation Logic ---
        const deleteForm = document.getElementById('delete-post-form');
        if (deleteForm) {
            deleteForm.addEventListener('submit', function(event) {
                const confirmed = confirm('Tem certeza de que deseja excluir este post permanentemente? Esta ação não pode ser desfeita.');
                if (!confirmed) {
                    event.preventDefault();
                }
            });
        }

        // --- Asset Upload Logic ---
        const fileInput = document.getElementById('asset-upload-input');
        const uploadStatus = document.getElementById('upload-status');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length === 0) {
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            
            const csrfToken = document.querySelector('input[name="csrf_token"]').value;

            uploadStatus.textContent = 'Uploading...';

            fetch("{{ url_for('upload_asset') }}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRF-Token': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    uploadStatus.textContent = `Error: ${data.error}`;
                } else if (data.markdownLink) {
                    uploadStatus.innerHTML = `Success! Link: <input type="text" value="${data.markdownLink}" readonly onclick="this.select();" class="form-control form-control-sm" style="display: inline-block; width: auto;">`;
                }
                fileInput.value = '';
            })
            .catch(error => {
                console.error('Upload failed:', error);
                uploadStatus.textContent = 'Upload failed!';
                fileInput.value = '';
            });
        });

    });
</script>
{% endblock %}
