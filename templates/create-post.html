{% extends './partials/base_layout.html' %}

{% block styles %}
<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/editor.css') }}">
{% endblock %}

{% block content %}
<div class="central-content" style="max-width: 1400px; margin-top: 40px; margin-left: auto; margin-right: auto;">
    
    <h2 class="section-title">Criar Novo Post</h2>

    <form method="POST" action="{{ url_for('create_post_save') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="editor-container">

            <div class="editor-header">
                <div class="row g-3 align-items-end">

                    <div class="col-md-4">
                        <label for="post_type" class="form-label">Tipo do Post:</label>
                        <select id="post_type" name="post_type" class="form-select">
                            <option value="News">Notícias</option>
                            <option value="Month-Problem">Problema do Mês</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="filename_base" class="form-label">Nome do Arquivo (Opcional):</label>
                        <input type="text" id="filename_base" name="filename_base" class="form-control" placeholder="meu-titulo-de-post">
                    </div>

                    <div class="col-md-2">
                        <input type="file" id="asset-upload-input" style="display: none;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('asset-upload-input').click();">
                            Importar Arquivo
                        </button>
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary">Salvar Post</button>
                    </div>

                </div>
                <div class="row">
                    <div class="col-12">
                        <span id="upload-status"></span>
                    </div>
                </div>
            </div> 
            <textarea id="post-content" name="full_content"></textarea>

        </div> 
        </form>
</div>

{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize EasyMDE
        const easyMDE = new EasyMDE({
            element: document.getElementById('post-content'),
            spellChecker: false,
        });

        const postTypeSelector = document.getElementById('post_type');

        // Function to load template content
        function loadTemplate(type) {
            let templatePath = '';
            if (type === 'News') {
                templatePath = "{{ url_for('static', filename='post_templates/Template_News.md') }}";
            } else if (type === 'Month-Problem') {
                templatePath = "{{ url_for('static', filename='post_templates/Template_MonthProblem.md') }}";
            }

            if (templatePath) {
                // Ask for confirmation if the editor is not empty
                if (easyMDE.value().trim() !== '') {
                    if (!confirm('Carregar um template irá substituir o conteúdo atual. Você tem certeza?')) {
                        return;
                    }
                }

                fetch(templatePath)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        // Get today's date in YYYY-MM-DD format
                        const today = new Date();
                        const year = today.getFullYear();
                        const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
                        const day = String(today.getDate()).padStart(2, '0');
                        const formattedDate = `${year}-${month}-${day}`;

                        // Replace the date line in the template text
                        const updatedText = text.replace(/date:.*$/m, `date: ${formattedDate}`);
                        
                        easyMDE.value(updatedText); // Load the modified text into the editor
                    })
                    .catch(error => console.error('Error loading template:', error));
            }
        }

        // Load the default template ('News') when the page loads
        loadTemplate(postTypeSelector.value);

        // Load a new template when the selection changes
        postTypeSelector.addEventListener('change', function() {
            loadTemplate(this.value);
        });

        // --- Asset Upload Logic ---
        const fileInput = document.getElementById('asset-upload-input');
        const uploadStatus = document.getElementById('upload-status');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length === 0) {
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            // Use CSRF token for the fetch request
            const csrfToken = document.querySelector('input[name="csrf_token"]').value;
            
            uploadStatus.textContent = 'Uploading...';

            fetch("{{ url_for('upload_asset') }}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRF-Token': csrfToken // Send CSRF token in header
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    uploadStatus.textContent = `Error: ${data.error}`;
                } else if (data.markdownLink) {
                    uploadStatus.innerHTML = `Success! Link: <input type="text" value="${data.markdownLink}" readonly onclick="this.select();" class="form-control form-control-sm" style="display: inline-block; width: auto;">`;
                }
                fileInput.value = ''; // Clear the input value
            })
            .catch(error => {
                console.error('Upload failed:', error);
                uploadStatus.textContent = 'Upload failed!';
                fileInput.value = ''; // Clear on fetch error
            });
        });

    });
</script>
{% endblock %}
